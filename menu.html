<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Menu | Larica Food Truck</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/menu.css?v=20261123" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-pagina="menu" data-area="admin">
  <div id="layout-shell"></div>
  <main class="conteudo-pagina">
    <div class="menu-topo">
      <p class="menu-saudacao" id="menu-saudacao">Olá</p>
      <h1>O que vamos fazer agora?</h1>
      <p class="menu-data" id="menu-data"></p>
    </div>

    <!-- Cards das áreas: montados por js/menu.js, só com as áreas que o usuário pode abrir -->
    <nav class="menu-grade" id="menu-grade" aria-label="Áreas do painel">
      <div class="estado-vazio">Carregando...</div>
    </nav>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/services/permissions-service.js"></script>
  <script src="js/app.js?v=20261123m"></script>
  <script src="js/menu.js?v=20261123"></script>
</body>
</html>
