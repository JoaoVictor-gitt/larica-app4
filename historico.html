<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Histórico | Larica Food Truck</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/historico.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-pagina="historico" data-area="admin">
  <div id="layout-shell"></div>
  <main class="conteudo-pagina">
    <div class="pagina-titulo">
      <h1>Histórico</h1>
    </div>

    <!-- Pedidos finalizados/cancelados (área Fazer Pedido) — separado da tabela de vendas/estoque abaixo -->
    <section class="secao-pedidos-finalizados">
      <div class="pagina-titulo">
        <h2 id="titulo-secao-historico-pedidos">Pedidos finalizados</h2>
        <div class="acoes-pedidos-finalizados" id="acoes-pedidos-finalizados-wrap">
          <button class="btn btn-secundario" id="botao-excluir-selecionados-historico" style="display:none;">Excluir selecionados</button>
          <button class="btn btn-secundario" id="botao-limpar-historico">Limpar histórico</button>
        </div>
      </div>

      <div class="filtro-categorias" id="abas-historico-pedidos">
        <button type="button" class="filtro-categoria-botao ativo" data-aba-historico="finalizado">Finalizados</button>
        <button type="button" class="filtro-categoria-botao" data-aba-historico="cancelado">Cancelados</button>
      </div>
      <p class="aviso-info" id="aviso-historico-cancelados" style="display:none;">
        Pedidos cancelados aparecem aqui só para consulta/auditoria — o valor não é contado como faturamento (já excluído do Dashboard) e não podem ser excluídos por aqui.
      </p>

      <div class="card tabela-pedidos-finalizados-wrap">
        <table class="tabela">
          <thead id="cabecalho-tabela-historico"></thead>
          <tbody id="corpo-tabela-pedidos-finalizados"></tbody>
        </table>
        <div class="estado-vazio" id="estado-carregando-pedidos-finalizados">Carregando pedidos...</div>
        <div class="estado-vazio" id="estado-erro-pedidos-finalizados" style="display:none;"></div>
        <div class="estado-vazio" id="estado-vazio-pedidos-finalizados" style="display:none;"></div>
      </div>
    </section>
  </main>

  <!-- Modal de confirmação de exclusão (reaproveitado pros 3 casos: individual, selecionados, limpar tudo) -->
  <div class="modal-overlay" id="modal-overlay-confirmar-exclusao">
    <div class="modal" style="max-width:420px;">
      <div class="modal-cabecalho">
        <h2 id="confirmar-exclusao-titulo">Excluir pedido?</h2>
        <button class="btn-icone" id="botao-fechar-modal-confirmar-exclusao" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo">
        <p id="confirmar-exclusao-mensagem"></p>
      </div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secundario" id="botao-cancelar-exclusao">Cancelar</button>
        <button type="button" class="btn btn-perigo" id="botao-confirmar-exclusao">Excluir pedido</button>
      </div>
    </div>
  </div>

  <!-- Modal "Ver detalhes" de um pedido finalizado -->
  <div class="modal-overlay" id="modal-overlay-detalhe-pedido-historico">
    <div class="modal modal-pedido">
      <div class="modal-cabecalho">
        <h2 id="detalhe-pedido-historico-titulo">Pedido</h2>
        <button class="btn-icone" id="botao-fechar-modal-detalhe-historico" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo" id="detalhe-pedido-historico-corpo"></div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secundario" id="botao-fechar-modal-detalhe-historico-rodape">Fechar</button>
        <button type="button" class="btn btn-perigo" id="botao-excluir-pedido-detalhe-historico">Excluir pedido</button>
      </div>
      <!-- botao-excluir-pedido-detalhe-historico fica display:none via JS quando o pedido exibido é cancelado (não pode ser excluído) -->
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/services/orders-service.js"></script>
  <script src="js/app.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
