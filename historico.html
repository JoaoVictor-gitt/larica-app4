<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Histórico | Larica Food Truck</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/historico.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-pagina="historico" data-area="admin">
  <div id="layout-shell"></div>
  <main class="conteudo-pagina">
    <div class="pagina-titulo">
      <h1>Histórico de pedidos</h1>
      <nav class="abas-area-pedidos" aria-label="Área de pedidos">
        <a class="aba-area-pedidos" href="pedidos.html">📋 Hoje</a>
        <a class="aba-area-pedidos ativa" href="historico.html" aria-current="page">🕒 Histórico</a>
        <a class="aba-area-pedidos" href="clientes.html" data-somente-admin>👥 Clientes</a>
      </nav>
    </div>

    <section class="secao-pedidos-finalizados">
      <div class="card filtros-historico">
        <div class="form-grupo">
          <label for="filtro-periodo-historico">Período</label>
          <select id="filtro-periodo-historico" class="input"></select>
        </div>
        <div class="form-grupo filtro-periodo-personalizado" id="grupo-periodo-personalizado" style="display:none;">
          <label for="filtro-historico-de">De</label>
          <input type="date" id="filtro-historico-de" class="input" />
        </div>
        <div class="form-grupo filtro-periodo-personalizado" id="grupo-periodo-personalizado-ate" style="display:none;">
          <label for="filtro-historico-ate">Até</label>
          <input type="date" id="filtro-historico-ate" class="input" />
        </div>
        <div class="form-grupo filtro-historico-busca">
          <label for="busca-historico">Buscar</label>
          <input type="search" id="busca-historico" class="input" placeholder="Número, nome ou telefone do cliente" />
        </div>
        <div class="form-grupo">
          <label for="filtro-situacao-historico">Situação</label>
          <select id="filtro-situacao-historico" class="input">
            <option value="">Todos</option>
            <option value="validos">Válidos</option>
            <option value="cancelados">Cancelados</option>
          </select>
        </div>
      </div>

      <div class="resumo-historico" id="resumo-historico" aria-live="polite"></div>
      <p class="aviso-info">Pedidos cancelados ficam registrados para consulta e auditoria e nunca entram no faturamento.</p>

      <div class="card tabela-pedidos-finalizados-wrap">
        <table class="tabela tabela-historico">
          <thead>
            <tr>
              <th>Pedido</th>
              <th>Data</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th>Pagamento</th>
              <th>Total</th>
              <th>Situação</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corpo-tabela-pedidos-finalizados"></tbody>
        </table>
        <div class="estado-vazio" id="estado-carregando-pedidos-finalizados">Carregando pedidos...</div>
        <div class="estado-vazio" id="estado-erro-pedidos-finalizados" style="display:none;"></div>
        <div class="estado-vazio" id="estado-vazio-pedidos-finalizados" style="display:none;"></div>
      </div>
    </section>
  </main>

  <!-- Modal "Ver detalhes" do pedido -->
  <div class="modal-overlay" id="modal-overlay-detalhe-pedido-historico">
    <div class="modal modal-pedido">
      <div class="modal-cabecalho">
        <h2 id="detalhe-pedido-historico-titulo">Pedido</h2>
        <button class="btn-icone" id="botao-fechar-modal-detalhe-historico" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo" id="detalhe-pedido-historico-corpo"></div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secundario" id="botao-fechar-modal-detalhe-historico-rodape">Fechar</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js?v=20261123"></script>
  <script src="js/storage.js?v=20261123"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/services/permissions-service.js"></script>
  <script src="js/services/orders-service.js?v=20261127"></script>
  <script src="js/app.js?v=20261123"></script>
  <script src="js/historico.js?v=20261123"></script>
</body>
</html>
