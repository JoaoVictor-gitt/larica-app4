<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Dashboard | Larica Food Truck</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-pagina="dashboard" data-area="admin">
  <div id="layout-shell"></div>
  <main class="conteudo-pagina">
    <div class="pagina-titulo pn-titulo">
      <h1>Dashboard</h1>
      <div class="pn-atalhos">
        <a href="financeiro.html" class="btn btn-secundario" id="pn-link-financeiro" style="display:none;">💶 Financeiro</a>
        <a href="relatorios.html" class="btn btn-secundario">📈 Relatórios de vendas</a>
      </div>
    </div>

    <!-- Filtro único: escopo de tudo abaixo -->
    <div class="pn-filtro">
      <div class="pn-chips" role="group" aria-label="Período">
        <button type="button" class="pn-chip" data-periodo="hoje">Hoje</button>
        <button type="button" class="pn-chip" data-periodo="7d">7 dias</button>
        <button type="button" class="pn-chip" data-periodo="30d">30 dias</button>
        <button type="button" class="pn-chip pn-chip-ativo" data-periodo="mes">Mês atual</button>
        <button type="button" class="pn-chip" data-periodo="mesanterior">Mês anterior</button>
        <button type="button" class="pn-chip" data-periodo="personalizado">Personalizado</button>
      </div>
      <div class="pn-custom" id="pn-custom" style="display:none;">
        <input type="date" id="pn-de" class="input" aria-label="De" /> <span>até</span>
        <input type="date" id="pn-ate" class="input" aria-label="Até" />
      </div>
      <p class="pn-periodo-texto" id="pn-periodo-texto"></p>
    </div>

    <div class="estado-vazio" id="pn-carregando">Carregando...</div>
    <div class="estado-vazio" id="pn-erro" style="display:none;"></div>

    <div id="pn-conteudo" style="display:none;">
      <section class="pn-topo">
        <div class="card pn-hero" id="pn-hero"></div>
        <div class="pn-tiles" id="pn-tiles"></div>
      </section>

      <section class="card pn-bloco">
        <div class="pn-bloco-cabecalho">
          <h2 id="pn-vendas-titulo">Evolução das vendas</h2>
          <button type="button" class="pn-link-tabela" id="pn-vendas-alternar" aria-pressed="false">Ver tabela</button>
        </div>
        <div class="pn-grafico" id="pn-grafico-vendas"></div>
        <div class="pn-tabela-wrap" id="pn-tabela-vendas" hidden></div>
      </section>

      <div class="pn-duas">
        <section class="card pn-bloco">
          <h2>Mais vendidos</h2>
          <p class="pn-sub">Quantidade vendida no período</p>
          <div id="pn-mais-vendidos"></div>
        </section>
        <section class="card pn-bloco" id="pn-bloco-rentaveis" style="display:none;">
          <h2>Mais rentáveis</h2>
          <p class="pn-sub">Contribuição no período (receita − CMV)</p>
          <div id="pn-mais-rentaveis"></div>
        </section>
      </div>

      <div class="pn-duas">
        <section class="card pn-bloco">
          <div class="pn-bloco-cabecalho"><h2>Estoque baixo</h2><a href="estoque.html" class="pn-link-tabela">Abrir Estoque</a></div>
          <div id="pn-estoque"></div>
        </section>
        <section class="card pn-bloco">
          <div class="pn-bloco-cabecalho"><h2>Produções recentes</h2><a href="producao.html" class="pn-link-tabela">Abrir Produção</a></div>
          <div id="pn-producoes"></div>
        </section>
      </div>

      <div class="pn-notas" id="pn-notas"></div>
    </div>
  </main>

  <div class="pn-tooltip" id="pn-tooltip" role="tooltip" hidden></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/services/permissions-service.js"></script>
  <script src="js/services/dashboard-service.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
