<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Pedidos | Larica Food Truck</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pedidos.css" />
  <link rel="stylesheet" href="css/comanda-impressao.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-pagina="pedidos" data-area="admin">
  <div id="layout-shell"></div>
  <main class="conteudo-pagina">
    <div class="pagina-titulo">
      <h1>Pedidos de hoje</h1>
      <nav class="abas-area-pedidos" aria-label="Área de pedidos">
        <a class="aba-area-pedidos ativa" href="pedidos.html" aria-current="page">📋 Hoje</a>
        <a class="aba-area-pedidos" href="historico.html">🕒 Histórico</a>
        <a class="aba-area-pedidos" href="clientes.html" data-somente-admin>👥 Clientes</a>
      </nav>
      <div class="indicador-conexao-pedidos" id="indicador-conexao-pedidos" data-estado="amarelo" role="status" aria-live="polite">
        <span class="indicador-conexao-ponto" aria-hidden="true"></span>
        <span id="indicador-conexao-texto">Conectando...</span>
        <span class="indicador-conexao-hora" id="indicador-conexao-hora"></span>
        <span class="contador-novos-pedidos" id="contador-novos-pedidos" style="display:none;"></span>
      </div>
    </div>

    <div class="card filtros-pedidos">
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="campo-busca-pedidos">Buscar</label>
        <input type="text" id="campo-busca-pedidos" class="input" placeholder="Número do pedido ou nome do cliente..." />
      </div>
      <div class="form-grupo" style="margin-bottom:0;">
        <label for="filtro-tipo-pedidos">Tipo</label>
        <select id="filtro-tipo-pedidos" class="input">
          <option value="">Todos</option>
          <option value="entrega">Entrega</option>
          <option value="comer_no_local">Comer no local</option>
          <option value="retirada">Retirada</option>
        </select>
      </div>
      <div class="linha-toggle-som">
        <label class="toggle-switch">
          <input type="checkbox" id="campo-som-pedidos" />
          <span class="toggle-switch-trilho"></span>
        </label>
        <span>🔔 Som de novo pedido</span>
        <span class="estado-som-pedidos" id="estado-som-pedidos" data-estado="desativado" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="estado-vazio" id="estado-carregando-pedidos">Carregando pedidos...</div>
    <div class="estado-vazio" id="estado-erro-pedidos" style="display:none;"></div>

    <section class="pedidos-hoje" id="kanban-pedidos" style="display:none;">
      <div class="resumo-pedidos-hoje" id="resumo-pedidos-hoje" aria-live="polite"></div>
      <div class="lista-pedidos-hoje" id="lista-pedidos-hoje"></div>
      <p class="estado-vazio" id="vazio-pedidos-hoje" style="display:none;">Nenhum pedido hoje até agora.</p>
    </section>
  </main>

  <!-- Modal de detalhes do pedido -->
  <div class="modal-overlay" id="modal-overlay-pedido">
    <div class="modal modal-pedido">
      <div class="modal-cabecalho">
        <h2 id="pedido-modal-titulo">Pedido</h2>
        <button class="btn-icone" id="botao-fechar-modal-pedido" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo" id="pedido-modal-corpo"></div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-perigo" id="botao-cancelar-pedido-detalhe" style="display:none;">Cancelar pedido</button>
        <button type="button" class="btn btn-secundario" id="botao-imprimir-pedido-detalhe">🖨️ Imprimir</button>
        <button type="button" class="btn btn-secundario" id="botao-imprimir-via-cliente-detalhe">🧾 Imprimir via do cliente</button>
        <button type="button" class="btn btn-secundario" id="botao-fechar-modal-pedido-rodape">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal de cancelamento de pedido -->
  <div class="modal-overlay" id="modal-overlay-cancelar-pedido">
    <div class="modal">
      <div class="modal-cabecalho">
        <h2>Cancelar pedido</h2>
        <button class="btn-icone" id="botao-fechar-modal-cancelar" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo">
        <p><strong id="cancelar-pedido-numero"></strong> · <span id="cancelar-pedido-cliente"></span></p>
        <div class="form-grupo">
          <label for="campo-motivo-cancelamento">Motivo do cancelamento</label>
          <textarea class="input" id="campo-motivo-cancelamento" rows="4" placeholder="Ex.: cliente solicitou cancelamento, item indisponível, endereço inválido..."></textarea>
          <span class="campo-erro" id="erro-motivo-cancelamento"></span>
        </div>
      </div>
      <div class="modal-rodape">
        <button type="button" class="btn btn-secundario" id="botao-voltar-cancelamento">Voltar</button>
        <button type="button" class="btn btn-perigo" id="botao-confirmar-cancelamento">Confirmar cancelamento</button>
      </div>
    </div>
  </div>

  <div id="comanda-impressao" class="comanda-impressao" aria-hidden="true"></div>

  <script src="js/utils.js?v=20261123"></script>
  <script src="js/storage.js?v=20261123"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/services/permissions-service.js"></script>
  <script src="js/services/settings-service.js"></script>
  <script src="js/services/orders-service.js?v=20261123"></script>
  <script src="js/app.js?v=20261123"></script>
  <!-- Impressão direta Epson (ePOS-Print) — IMPRESSAO_EPSON_DIRETA_ATIVA em js/pedidos.js está
       true: clique em Imprimir/Reimprimir e a impressão automática de novos pedidos usam este
       caminho (gerarComandaEposPrintXml -> EpsonPrinterService.imprimir -> HTTPS/443). -->
  <script src="vendor/epson/epos-2.27.0.js"></script>
  <script src="js/services/epson-print-builder.js"></script>
  <script src="js/services/epson-printer-service.js"></script>
  <script src="js/pedidos.js?v=20261123"></script>
</body>
</html>
