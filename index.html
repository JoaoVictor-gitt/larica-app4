<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Aplica o tema salvo antes da primeira renderização, para não piscar claro→escuro
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Larica Food Truck</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home-larica.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="home-larica-body" data-area="pedido">
  <header class="header-larica">
    <div class="header-larica-conteudo">
      <a class="header-larica-logo" href="index.html" aria-label="Larica — início">
        <img src="logo.png" alt="Larica" />
      </a>
      <nav class="header-larica-nav">
        <a href="index.html">Home</a>
        <a href="pedido.html">Menu</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero-larica">
      <!-- Mídia de fundo do Hero — hoje um placeholder (sem foto/vídeo real no
           projeto ainda). data-tipo-midia é o hook que uma futura tela de
           Configurações > Aparência do site vai controlar, trocando entre
           "imagem"/"video" sem exigir nenhuma mudança de CSS. Quando a foto
           real chegar, troca-se .hero-media-placeholder por:
             <img class="hero-media-elemento" src="images/hero-churrasco.jpg"
                  alt="" loading="eager" fetchpriority="high" />
           Para vídeo, mesma classe .hero-media-elemento num <video autoplay
           muted loop playsinline poster="...">, sempre com poster/fallback. -->
      <div class="hero-media" data-tipo-midia="imagem">
        <div class="hero-media-placeholder" aria-hidden="true"></div>
        <div class="hero-media-overlay"></div>
      </div>

      <div class="hero-conteudo">
        <p class="hero-eyebrow">Brazilian Street Food</p>
        <h1 class="hero-headline">GRILLED. FRESH. BRAZILIAN.</h1>
        <p class="hero-subtexto">Brazilian BBQ · Skewers · Street Food</p>

        <ul class="hero-badges">
          <li>Brazilian BBQ</li>
          <li>Freshly Grilled</li>
          <li>Vegetarian Options</li>
        </ul>

        <a class="hero-cta" href="pedido.html">Order Now</a>

        <ul class="hero-modalidades">
          <li>Pick Up</li>
          <li>Delivery</li>
          <li>Dine In</li>
        </ul>
      </div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script>
    // Garante que o localStorage já esteja inicializado antes de entrar em qualquer área
    inicializarStorage();
  </script>
</body>
</html>
