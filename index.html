<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Aplica o tema salvo antes da primeira renderização, para não piscar claro→escuro
    (function () {
      try {
        var config = JSON.parse(localStorage.getItem('caju_configuracoes') || '{}');
        document.documentElement.setAttribute('data-tema', config.tema === 'claro' ? 'claro' : 'escuro');
      } catch (erro) {}
    })();
  </script>
  <title>Larica Food Truck</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home-larica.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="home-larica-body" data-area="pedido">
  <header class="header-larica">
    <div class="header-larica-conteudo">
      <a class="header-larica-logo" href="index.html" aria-label="Larica — início">
        <img src="logo.png" alt="Larica" />
      </a>
      <nav class="header-larica-nav">
        <a href="index.html">Home</a>
        <a href="pedido.html">Menu</a>
        <a class="header-larica-cta" href="pedido.html">Order Now</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero-larica">
      <!-- Mídia de fundo do Hero — .hero-media-placeholder (gradiente) é o que aparece
           imediatamente, sem esperar rede nenhuma. js/home.js (Etapa 2.5, carregado com defer
           no fim da página) consulta business_settings.hero_media_* e, se houver mídia
           configurada e ela carregar com sucesso, insere um <img>/<video
           class="hero-media-elemento"> por cima do placeholder (fade-in via
           .hero-media-elemento-visivel, css/home-larica.css) — nunca remove o placeholder do
           DOM, então qualquer falha mantém o gradiente visível. data-tipo-midia é atualizado
           dinamicamente por home.js ("imagem"/"video"). -->
      <div class="hero-media" data-tipo-midia="imagem">
        <div class="hero-media-placeholder" aria-hidden="true"></div>
        <div class="hero-media-overlay"></div>
      </div>

      <div class="hero-conteudo">
        <p class="hero-eyebrow">Brazilian Street Food</p>
        <h1 class="hero-headline">
          <span>Grilled.</span>
          <span>Fresh.</span>
          <span>Brazilian.</span>
        </h1>
        <p class="hero-subtexto">Brazilian BBQ • Skewers • Street Food</p>

        <ul class="hero-badges">
          <li>🔥 Brazilian BBQ</li>
          <li>🌿 Freshly Grilled</li>
          <li>🌱 Vegetarian Options</li>
        </ul>

        <a class="hero-cta" href="pedido.html">Order Now <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script>
    // Garante que o localStorage já esteja inicializado antes de entrar em qualquer área
    inicializarStorage();
  </script>

  <!-- Mídia do Hero (redesign Larica, Etapa 2.5) — lê business_settings.hero_media_* (público,
       via getHeroMediaSettings) e troca o placeholder pela mídia configurada em Configurações >
       Aparência do site. defer: não bloqueia o parse/pintura do Hero/placeholder acima; a ordem
       entre scripts com defer é preservada, então executam nesta sequência mesmo assim. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/services/settings-service.js" defer></script>
  <script src="js/home.js" defer></script>
</body>
</html>
